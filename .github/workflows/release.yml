name: Build OnePlus 8T Kernel (with Docker Support)

on:
  push:
    tags:
      - "v*"

env:
  KERNEL_SOURCE: "https://github.com/LineageOS/android_kernel_oneplus_sm8250"
  KERNEL_BRANCH: "lineage-23.2"
  DEFCONFIG: "vendor/kona-perf_defconfig"
  ANYKERNEL3_URL: "https://github.com/osm0sis/AnyKernel3"
  MAKE_OPTS: "CC=clang-12 LD=ld.lld-12 AR=llvm-ar-12 NM=llvm-nm-12 OBJCOPY=llvm-objcopy-12 OBJDUMP=llvm-objdump-12 STRIP=llvm-strip-12 CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi-"

jobs:
  build:
    name: Build Kernel on ARM64
    runs-on: ubuntu-22.04-arm

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git ccache flex bison build-essential \
            libssl-dev libelf-dev bc python3 curl wget zip unzip \
            clang-12 lld-12 llvm-12 gcc-arm-linux-gnueabi binutils-aarch64-linux-gnu

      - name: Setup Clang 12 Symlinks
        run: |
          mkdir -p $HOME/clang-12-bin
          ln -s /usr/bin/clang-12 $HOME/clang-12-bin/clang
          ln -s /usr/bin/ld.lld-12 $HOME/clang-12-bin/ld.lld
          ln -s /usr/bin/llvm-ar-12 $HOME/clang-12-bin/llvm-ar
          ln -s /usr/bin/llvm-nm-12 $HOME/clang-12-bin/llvm-nm
          ln -s /usr/bin/llvm-objcopy-12 $HOME/clang-12-bin/llvm-objcopy
          ln -s /usr/bin/llvm-objdump-12 $HOME/clang-12-bin/llvm-objdump
          ln -s /usr/bin/llvm-strip-12 $HOME/clang-12-bin/llvm-strip
          ln -s /usr/bin/llvm-readelf-12 $HOME/clang-12-bin/llvm-readelf
          echo "$HOME/clang-12-bin" >> $GITHUB_PATH

      - name: Clone Kernel Source
        run: |
          git clone --depth=1 -b ${{ env.KERNEL_BRANCH }} ${{ env.KERNEL_SOURCE }} kernel-workspace

      - name: Patch Kernel Source (Fix QC Charger Bug)
        working-directory: kernel-workspace
        run: |
          FILE="drivers/power/supply/qcom/schgm-flash.c"
          if [ -f "$FILE" ]; then
            echo "Patching $FILE ..."
            sed -i '1i #include "smb5-lib.h"' "$FILE"
          fi

      - name: Configure Docker Support
        working-directory: kernel-workspace
        run: |
          cat << 'EOF' > docker.config
          CONFIG_NAMESPACES=y
          CONFIG_NET_NS=y
          CONFIG_PID_NS=y
          CONFIG_IPC_NS=y
          CONFIG_UTS_NS=y
          CONFIG_USER_NS=y
          CONFIG_CGROUPS=y
          CONFIG_CGROUP_CPUACCT=y
          CONFIG_CGROUP_DEVICE=y
          CONFIG_CGROUP_FREEZER=y
          CONFIG_CGROUP_SCHED=y
          CONFIG_CPUSETS=y
          CONFIG_MEMCG=y
          CONFIG_KEYS=y
          CONFIG_VETH=y
          CONFIG_BRIDGE=y
          CONFIG_BRIDGE_NETFILTER=y
          CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y
          CONFIG_NETFILTER_XT_MATCH_CONNTRACK=y
          CONFIG_NETFILTER_XT_MATCH_IPVS=y
          CONFIG_IP_NF_FILTER=y
          CONFIG_IP_NF_NAT=y
          CONFIG_IP_NF_TARGET_MASQUERADE=y
          CONFIG_IP_NF_TARGET_REJECT=y
          CONFIG_NETFILTER_XT_MARK=y
          CONFIG_NETFILTER_XT_SET=y
          CONFIG_IP_VS=y
          CONFIG_IP_VS_IPV4=y
          CONFIG_IP_VS_RR=y
          CONFIG_POSIX_MQUEUE=y
          CONFIG_OVERLAY_FS=y
          CONFIG_SECCOMP=y
          CONFIG_SECCOMP_FILTER=y
          CONFIG_BPF_SYSCALL=y
          CONFIG_CGROUP_BPF=y
          CONFIG_TUN=y
          CONFIG_BLK_CGROUP=y
          EOF
          make O=out ARCH=arm64 ${{ env.DEFCONFIG }} ${{ env.MAKE_OPTS }}
          ./scripts/kconfig/merge_config.sh -m -O out out/.config docker.config
          make O=out ARCH=arm64 olddefconfig ${{ env.MAKE_OPTS }}

      - name: Build Kernel
        working-directory: kernel-workspace
        run: |
          make -j$(nproc) O=out ARCH=arm64 ${{ env.MAKE_OPTS }} KCFLAGS="-Wno-error" || \
          make -j1 O=out ARCH=arm64 ${{ env.MAKE_OPTS }} KCFLAGS="-Wno-error"

      - name: Package with AnyKernel3
        run: |
          git clone --depth=1 ${{ env.ANYKERNEL3_URL }} AnyKernel3
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' AnyKernel3/anykernel.sh
          if [ -f kernel-workspace/out/arch/arm64/boot/Image ]; then
            cp kernel-workspace/out/arch/arm64/boot/Image AnyKernel3/
          fi
          if [ -f kernel-workspace/out/arch/arm64/boot/dts/vendor/qcom/kona-v2.1.dtb ]; then
            cp kernel-workspace/out/arch/arm64/boot/dts/vendor/qcom/*.dtb AnyKernel3/dtb/ || true
          fi
          cd AnyKernel3
          zip -r9 ../OnePlus8T-Docker-Kernel.zip * -x .git README.md *placeholder

      - name: Upload binary to Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            OnePlus8T-Docker-Kernel.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

